name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # setup-go can't resolve the "1.27rc1" toolchain directive in go.mod;
          # pin the release candidate explicitly. Revert to go-version-file once
          # Go 1.27 ships.
          go-version: 1.27.0-rc.1
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tsc and eslint back the client.js static checks in client_check_test.go,
      # which skip when the tools are absent (as they are on dev machines).
      - name: Install JS linters
        run: npm install -g typescript@5 eslint@9

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting
        run: |
          diff=$(goimports -l .)
          if [ -n "$diff" ]; then
            echo "the following files are not goimports-clean:"
            echo "$diff"
            echo
            echo "run: goimports -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # bun and jsdom back the jsdom-driven client.js tests and the vdom
      # diff/apply property tests, which skip when bun is absent (as it may
      # be on dev machines). Pinned versions and frozen lockfiles keep the
      # runs reproducible. Installed after the formatting check so goimports
      # never walks a node_modules tree.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install jsdom
        run: |
          bun install --frozen-lockfile --cwd testdata
          bun install --frozen-lockfile --cwd internal/vdom/testdata

      - name: Test
        run: go test -race ./...
