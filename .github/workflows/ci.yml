name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting
        run: |
          diff=$(goimports -l .)
          if [ -n "$diff" ]; then
            echo "the following files are not goimports-clean:"
            echo "$diff"
            echo
            echo "run: goimports -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
